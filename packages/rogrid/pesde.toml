name = "rogrid/rogrid"
version = "0.2.0"
authors = ["JustSammyyy"]
description = "The RoGrid core library"
license = "MIT"
repository = "https://github.com/RoGrid-HQ/rogrid"

includes = [
  "pesde.toml",
  "LICENSE",
  "README.md",
  "docs/**/*.md",
  "src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
