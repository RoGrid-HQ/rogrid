[package]
name = "rogrid"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
inquire = "0.9.4"
full_moon = { version = "2.2.0", features = ["luau"] }
notify = "8.2.0"
ctrlc = "3.5.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9.7", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "0.10.9"
