name: Publish release

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Number of the merged release PR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    if: >-
      github.repository == 'RoGrid-HQ/rogrid' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'JustSammyyy' &&
      github.triggering_actor == 'JustSammyyy'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      runtime: ${{ steps.release.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Resolve the reviewed release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'Enter a PR number.'; exit 1; }
          pr=$(gh pr view "$RELEASE_PR" --json state,baseRefName,headRefName,mergeCommit)
          echo "$pr" | jq -e '.state == "MERGED" and .baseRefName == "main" and (.headRefName | startswith("release/v"))' >/dev/null
          sha=$(echo "$pr" | jq -r .mergeCommit.oid)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          info=$(cargo xtask release info)
          version=$(echo "$info" | jq -r .cli)
          runtime=$(echo "$info" | jq -r .runtime)
          test "$(echo "$pr" | jq -r .headRefName)" = "release/v$version"
          test -s "releases/v$version.md"
          previous=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${sha}^")
          cargo xtask release check --base "$previous"
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            test "$(git rev-parse "v$version^{commit}")" = "$sha" || { echo 'The tag belongs to another commit.'; exit 1; }
          fi
          printf 'sha=%s\nversion=%s\nruntime=%s\n' "$sha" "$version" "$runtime" >> "$GITHUB_OUTPUT"
          printf 'Releasing CLI **%s**, runtime **%s**, from commit `%s` (PR #%s).\n' "$version" "$runtime" "$sha" "$RELEASE_PR" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      release: true
    # No secrets are inherited by validation jobs.

  build:
    needs: [resolve, checks]
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve the existing glibc baseline and asset names expected by Rokit.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --locked --release --package rogrid --target ${{ matrix.target }}
      - name: Verify and package binary
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PLATFORM: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "target/$TARGET/release"
          binary=rogrid
          if [ "$RUNNER_OS" = Windows ]; then binary=rogrid.exe; fi
          test "$(./"$binary" --version)" = "rogrid $VERSION"
          archive="rogrid-$VERSION-$PLATFORM.zip"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$archive" "$binary"; else zip "$archive" "$binary"; fi
          mv "$archive" "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.name }}
          path: rogrid-*.zip
          if-no-files-found: error

  publish-packages:
    needs: [resolve, checks, build]
    if: github.actor == 'JustSammyyy' && github.triggering_actor == 'JustSammyyy'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: ./.github/actions/setup-release-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-packages
          path: target/release-packages
      - name: Build the publishing helper before exposing credentials
        run: cargo build --locked --package xtask
      - name: Publish missing packages and verify their contents
        env:
          PESDE_TOKEN: ${{ secrets.PESDE_TOKEN }}
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
        run: |
          set -euo pipefail
          trap 'pesde auth logout >/dev/null 2>&1 || true; wally logout >/dev/null 2>&1 || true' EXIT
          target/debug/xtask release publish --artifacts target/release-packages

  smoke:
    needs: [resolve, publish-packages]
    runs-on: ubuntu-24.04
    # Installed packages and candidate binaries run without publishing credentials.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/setup-release-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-x86_64
          path: target/release-smoke
      - name: Install and build projects using the published packages
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          unzip "target/release-smoke/rogrid-$VERSION-linux-x86_64.zip" -d target/release-smoke
          chmod +x target/release-smoke/rogrid
          cargo xtask release smoke --cli target/release-smoke/rogrid

  publish-cli:
    needs: [resolve, build, smoke]
    if: github.actor == 'JustSammyyy' && github.triggering_actor == 'JustSammyyy'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          path: target/release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          count=$(find target/release-assets -maxdepth 1 -name 'rogrid-*.zip' | wc -l)
          test "$count" = 5
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$RELEASE_SHA" >/dev/null
          fi
          existing=$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f tag="$tag" \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { isDraft } } }' \
            --jq '.data.repository.release.isDraft')
          if [ "$existing" = false ]; then
            echo 'This CLI release is already published. Leaving its assets unchanged.'
            exit 0
          fi
          if [ -z "$existing" ]; then
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file "releases/$tag.md"
          fi
          gh release upload "$tag" target/release-assets/*.zip --clobber
          gh release edit "$tag" --draft=false --latest --notes-file "releases/$tag.md"
          printf 'Published [%s](https://github.com/%s/releases/tag/%s).\n' "$tag" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
