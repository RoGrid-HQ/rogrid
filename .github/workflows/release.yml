# Builds the rogrid CLI for every supported platform and attaches the zips
# to a GitHub Release. Triggered by pushing a tag like v0.1.0.
#
# Asset naming follows Rojo/Rokit conventions so `rokit add RoGrid-HQ/rogrid`
# can pick the right file:  rogrid-<version>-<os>-<arch>.zip
# Each zip contains only the binary at the top level.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rogrid.exe
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: rogrid
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: rogrid
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rogrid
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: rogrid

    steps:
      - uses: actions/checkout@v7

      # rustup is preinstalled on all GitHub runners; just add the target.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p rogrid

      # Strip the leading "v" from the tag: v0.1.0 -> 0.1.0
      - name: Read version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rogrid-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath $name

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="rogrid-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          # -j = junk paths, so the zip contains just "rogrid" at the top level
          zip -j "$name" "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: rogrid-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pull every platform's zip into one folder.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes