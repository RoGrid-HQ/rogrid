name: Release

# Tag a commit `v1.2.3` and push the tag. This builds rogrid for every platform
# and publishes a GitHub Release with one zip per platform, named so that
# Rokit, Aftman and Foreman can pick the right one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must match the crate version, so a release never ships a binary
  # that reports a different version than its name.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with Cargo.toml
        run: |
          version=$(grep -m1 '^version' crates/rogrid/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match crate version $version"
            exit 1
          fi

  build:
    needs: check-version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on 22.04 so the binary runs on older glibc too.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --package rogrid --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          zip="rogrid-$version-${{ matrix.name }}.zip"
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$zip" rogrid.exe
          else
            zip "$zip" rogrid
          fi
          mv "$zip" "$GITHUB_WORKSPACE/"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: rogrid-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
