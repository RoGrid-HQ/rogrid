name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to validate.
        type: string
        required: true
      release:
        description: Retain the checked registry packages for publishing.
        type: boolean
        default: false

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: GitHub release workflow tests
        if: runner.os == 'Linux'
        run: bash .github/tests/release.sh

      - name: Release metadata
        run: cargo xtask release check

  packages:
    name: Package checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/setup-release-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Real Wally and Rojo checks
        run: cargo test -p rogrid --locked --test wally_tools -- --ignored
      - name: Real manager setup and complete generated type checking
        run: cargo test -p rogrid --locked --test project_tools -- --ignored
      - name: Payload validator and runtime tests
        run: lune run test
      - name: Generated payload type checking
        run: cargo test -p rogrid --locked payloads_pass_luau_typechecking -- --ignored
      - name: Generated startup and compatibility guards
        run: cargo test -p rogrid --locked generated_startup_and_compatibility_guards_execute -- --ignored
      - name: Check both package archives without publishing
        run: cargo xtask release package --output target/release-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.release }}
        with:
          name: runtime-packages
          path: target/release-packages/*
          if-no-files-found: error
