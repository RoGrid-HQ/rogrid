[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
tempfile = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "6", default-features = false, features = ["deflate"] }
